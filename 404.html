  <script>

        const prev = currentWord;
        words[prev].classList.remove('active');
        words[prev].classList.add('exit');

    const VS = 'attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}';
    const FS = `precision mediump float;
uniform float T;uniform float G;uniform vec2 R;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);return mix(mix(h(i),h(i+vec2(1,0)),u.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),u.x),u.y);}
void main(){
  vec2 pos=(gl_FragCoord.xy-0.5*R)/R.y;
  vec2 id=floor(pos*G);vec2 f=fract(pos*G)-0.5;
  float nr=h(id);
  float flicker=sin(T*6.0+nr*6.28)*0.25+0.75;
  float patches=smoothstep(0.20,0.75,n(id*0.05+T*0.15));
  float rhythm=clamp(sin(T*0.7)*2.0+1.0,0.0,1.0);
  float sa=smoothstep(0.1,0.8,patches*(rhythm*0.85+0.15))*(nr*0.5+0.5);
  float spark=smoothstep(0.4,0.05,length(f))*sa*flicker;
  float wire=max(smoothstep(0.08,0.0,abs(f.x)),smoothstep(0.08,0.0,abs(f.y)));
  float bg=n(pos*2.0+T*0.1);
  vec3 col=mix(vec3(0.01,0.03,0.01),vec3(0.03,0.12,0.05),bg);
  col+=vec3(0.0,0.45,0.18)*(1.0-smoothstep(0.0,1.4,length(pos)))*(0.6+0.4*rhythm);
  col+=vec3(0.10,0.70,0.30)*wire*0.28*(0.6+0.4*rhythm);
  col+=mix(vec3(0.10,0.70,0.30),vec3(0.40,1.00,0.50),spark)*spark*4.0;
  col+=vec3(0.90,1.00,0.90)*pow(spark,3.0)*2.5;
  col*=smoothstep(1.6,0.1,length(pos));
  gl_FragColor=vec4(clamp(col,0.0,1.0),1.0);
}`;

    function init() {
      var gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      if (!gl) { console.warn('[plasma] WebGL not supported'); return; }

      function mkShader(src, type) {
        var s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
          console.error('[plasma] shader compile error:', gl.getShaderInfoLog(s)); return null;
        }
        return s;
      }

      var vs = mkShader(VS, gl.VERTEX_SHADER);
      var fs = mkShader(FS, gl.FRAGMENT_SHADER);
      if (!vs || !fs) return;

      var prog = gl.createProgram();
      gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) {
        console.error('[plasma] link error:', gl.getProgramInfoLog(prog)); return;
      }
      gl.useProgram(prog);

      var buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
      var al = gl.getAttribLocation(prog, 'a');
      gl.enableVertexAttribArray(al);
      gl.vertexAttribPointer(al, 2, gl.FLOAT, false, 0, 0);

      var uT = gl.getUniformLocation(prog, 'T');
      var uG = gl.getUniformLocation(prog, 'G');
      var uR = gl.getUniformLocation(prog, 'R');
      var DPR = Math.min(window.devicePixelRatio || 1, 1.5);

      function resize() {
        var w = canvas.offsetWidth || window.innerWidth;
        var h = canvas.offsetHeight || window.innerHeight;
        canvas.width = Math.round(w * DPR);
        canvas.height = Math.round(h * DPR);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.uniform1f(uG, w < 768 ? 150.0 : 80.0);
      }
      resize();
      window.addEventListener('resize', resize, { passive: true });

      var t0 = performance.now();
      var rafId = null;
      function draw() {
        gl.uniform1f(uT, (performance.now() - t0) * 0.001);
        gl.uniform2f(uR, canvas.width, canvas.height);
        gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        rafId = requestAnimationFrame(draw);
      }

      canvas.classList.add('ready');
      draw();

      document.addEventListener('visibilitychange', function() {
        if (document.hidden) { cancelAnimationFrame(rafId); rafId = null; }
        else { draw(); }
      });
    }

    setTimeout(init, 150);
  })();

});
</script>
