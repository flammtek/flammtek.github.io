<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1600" height="900" fill="#040D12"/>
  <defs>
    <radialGradient id="plasmaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#0d9488" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.2"/>
    </linearGradient>
  </defs>
  
  <!-- Background Glow -->
  <circle cx="800" cy="450" r="600" fill="url(#plasmaGlow)"/>
  
  <!-- Abstract Tech Waves -->
  <path d="M0 450C300 350 500 550 800 450C1100 350 1300 550 1600 450V900H0V450Z" fill="url(#waveGrad)"/>
  <path d="M0 500C400 400 600 600 800 500C1000 400 1200 600 1600 500V900H0V500Z" fill="#14b8a6" fill-opacity="0.05"/>
  
  <!-- Tech Elements (Particles/Nodes) -->
  <g stroke="#2dd4bf" stroke-width="1" stroke-opacity="0.3">
    <circle cx="400" cy="300" r="40"/>
    <circle cx="400" cy="300" r="2"/>
    <line x1="400" y1="300" x2="500" y2="200"/>
    
    <circle cx="1200" cy="600" r="60"/>
    <circle cx="1200" cy="600" r="3"/>
    <line x1="1200" y1="600" x2="1050" y2="700"/>
    
    <circle cx="200" cy="700" r="30"/>
    <line x1="200" y1="700" x2="300" y2="750"/>
  </g>
  
  <!-- Shield/Droplet Abstraction -->
  <g transform="translate(700, 300) scale(8)" stroke="#14b8a6" stroke-width="1" opacity="0.4">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
  </g>
</svg>
